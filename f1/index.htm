<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sport TV</title>
  <style>
    body {
    /* Path to image file */
      background-image: url('f1.png');
      /** // */
      background-repeat: no-repeat; 
      background-position: center; 
      /*background-size: cover;*/
      background-attachment: fixed; 
      min-height: 100vh;
      margin: 0;
    }
    #countdown-timer {
      font-family: Arial, sans-serif;
      font-size: 24px;
      text-align: center;
      margin: 40px auto;
      padding: 20px;
      border: 2px solid #ccc;
      width: 300px;
      border-radius: 8px;
      background: rgb(0 0 0 / 55%);
      color: #ffffff;
    }
    #my-iframe {display: none; /* Hidden initially */}
  </style>
</head>
<body>
  <div id="countdown-timer">Loading timer...</div>
  <!-- Iframe Source -->
  <iframe id="my-iframe" marginheight="0" marginwidth="0"
  src="https://ppv.st/live/f1/2026/brazil/race"
   scrolling="no" allowfullscreen="yes" allow="encrypted-media; picture-in-picture;" width="100%" height="100%" frameborder="0" style="position:absolute;"></iframe>
  <script>
    // Set date and time here
    const countDownDate = new Date("Nov 8, 2026 12:00:00").getTime();
    //
    const iframeEl = document.getElementById('my-iframe');
    const timerElement = document.getElementById("countdown-timer");
    const x = setInterval(function() {
      const now = new Date().getTime();
      const distance = countDownDate - now;
      if (distance < 0) {
        clearInterval(x);
        timerElement.innerHTML = "EXPIRED";
        timerElement.style.display = 'none'; // Hide timer
        iframeEl.style.display = 'block';      // Show iframe
        iframeEl.id="player";
        return;
      }
      const days = Math.floor(distance / (1000 * 60 * 60 * 24));
      const hours = Math.floor((distance % (1000 * 60 * 60 * 24)) / (1000 * 60 * 60));
      const minutes = Math.floor((distance % (1000 * 60 * 60)) / (1000 * 60 * 60 / 60));
      const seconds = Math.floor((distance % (1000 * 60)) / 1000);
      timerElement.innerHTML = `${days}d ${hours}h ${minutes}m ${seconds}s`;
    }, 1000);
  </script>
</body>
</html>
