<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>database Auth</title>
    <!-- Tailwind CSS for clean, rapid styling -->
    <script src="https://jsdelivr.net"></script>
    <!-- Official Supabase JS Client CDN -->
    <script src="https://jsdelivr.net"></script>
</head>
<body class="bg-slate-50 text-slate-800 flex items-center justify-center min-h-screen p-4">

    <div class="w-full max-w-md bg-white rounded-xl shadow-md p-6 space-y-6">
        <h2 class="text-2xl font-bold text-center text-slate-900">
            <a href="https://supabase.com">SupaBase</a> DataBase Auth</h2>
        
        <!-- App Status Messages -->
        <div id="status-msg" class="hidden text-sm p-3 rounded-lg border"></div>

        <!-- AUTH FORM (Sign In / Sign Up) -->
        <form id="auth-form" class="space-y-4">
            <div>
                <label class="block text-sm font-medium text-slate-700 mb-1">Email Address</label>
                <input type="email" id="email" required class="w-full px-3 py-2 border border-slate-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-indigo-500">
            </div>
            <div>
                <label class="block text-sm font-medium text-slate-700 mb-1">Password</label>
                <input type="password" id="password" required class="w-full px-3 py-2 border border-slate-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-indigo-500">
            </div>
            <div class="flex gap-4 pt-2">
                <button type="submit" id="btn-login" class="flex-1 bg-indigo-600 hover:bg-indigo-700 text-white font-medium py-2 px-4 rounded-lg transition-colors cursor-pointer">
                    Sign In
                </button>
                <button type="button" id="btn-signup" class="flex-1 bg-slate-100 hover:bg-slate-200 text-slate-700 font-medium py-2 px-4 rounded-lg transition-colors cursor-pointer">
                    Sign Up
                </button>
            </div>
        </form>

        <!-- DASHBOARD (Visible only when logged in) -->
        <div id="dashboard" class="hidden space-y-4 text-center">
            <div class="bg-emerald-50 border border-emerald-200 text-emerald-800 p-4 rounded-lg">
                <!-- <p class="font-semibold">Successfully Authenticated!</p> -->
                <p id="user-email" class="text-sm mt-1 text-emerald-600 break-all"></p>
            </div>
            <button id="btn-logout" class="w-full bg-rose-600 hover:bg-rose-700 text-white font-medium py-2 px-4 rounded-lg transition-colors cursor-pointer">
                Sign Out
            </button>
        </div>
    </div>
    <script>
        // REPLACE THESE WITH YOUR ACTUAL SUPABASE CREDENTIALS
        const SUPABASE_URL = "https://supabase.co"; 
        const SUPABASE_ANON_KEY = "";

        // Initialize Supabase Client
        const supabase = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

        // DOM elements
        const authForm = document.getElementById('auth-form');
        const emailInput = document.getElementById('email');
        const passwordInput = document.getElementById('password');
        const btnSignUp = document.getElementById('btn-signup');
        const dashboard = document.getElementById('dashboard');
        const userEmailText = document.getElementById('user-email');
        const btnLogout = document.getElementById('btn-logout');
        const statusMsg = document.getElementById('status-msg');

        // Helper to display UI notifications
        function showMessage(text, isError = false) {
            statusMsg.textContent = text;
            statusMsg.className = `text-sm p-3 rounded-lg border ${
                isError ? 'bg-rose-50 border-rose-200 text-rose-800' : 'bg-blue-50 border-blue-200 text-blue-800'
            }`;
        }

        // Listen for Realtime Auth Changes (Session updates)
        supabase.auth.onAuthStateChange((event, session) => {
            if (session) {
                // User logged in
                authForm.classList.add('hidden');
                dashboard.classList.remove('hidden');
                userEmailText.textContent = `Logged in as: ${session.user.email}`;
            } else {
                // User logged out
                authForm.classList.remove('hidden');
                dashboard.classList.add('hidden');
                userEmailText.textContent = '';
            }
        });

        // Handle Sign In (Form submission)
        authForm.addEventListener('submit', async (e) => {
            e.preventDefault();
            const email = emailInput.value;
            const password = passwordInput.value;

            const { error } = await supabase.auth.signInWithPassword({ email, password });
            if (error) showMessage(error.message, true);
        });

        // Handle Sign Up
        btnSignUp.addEventListener('click', async () => {
            const email = emailInput.value;
            const password = passwordInput.value;
            if (!email || !password) {
                showMessage("Please fill out both fields to sign up.", true);
                return;
            }

            const { data, error } = await supabase.auth.signUp({ email, password });
            if (error) {
                showMessage(error.message, true);
            } else if (data?.user?.identities?.length === 0) {
                showMessage("This email is already registered. Try logging in.", true);
            } else {
                showMessage("Registration check complete! Check your email inbox for a validation link.");
            }
        });

        // Handle Sign Out
        btnLogout.addEventListener('click', async () => {
            const { error } = await supabase.auth.signOut();
            if (error) showMessage(error.message, true);
            else showMessage("Successfully logged out.");
        });
    </script>
</body>
</html>
